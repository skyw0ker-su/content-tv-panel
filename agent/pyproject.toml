[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signage-agent"
version = "0.1.0"
description = "Plays the scheduled playlist on a TV-connected mini PC"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-vlc>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signage-agent = "signage_agent.main:main"

[tool.setuptools.packages.find]
include = ["signage_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
